<style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #2c3e50; color: white; margin: 0; }
        #game-card { background: #34495e; padding: 25px; border-radius: 15px; text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .score-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: #bdc3c7; margin-bottom: 5px; }
        .progress-container { background: #2c3e50; height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress-bar { background: #3498db; width: 0%; height: 100%; transition: 0.3s; }

        /* THE PLATE */
        .plate { background: white; color: black; font-size: 3.5rem; font-weight: bold; padding: 10px 20px; border-radius: 5px; border: 4px solid black; display: inline-block; margin-bottom: 20px; min-width: 140px; position: relative; transition: 0.2s; }
        .plate::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: #003399; }

        /* THE ANIMATIONS */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        @keyframes glow {
            0% { box-shadow: 0 0 0px #2ecc71; }
            50% { box-shadow: 0 0 20px #2ecc71; border-color: #2ecc71; }
            100% { box-shadow: 0 0 0px #2ecc71; }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .animate-glow { animation: glow 0.8s ease-in-out; }

        .options { display: grid; gap: 12px; }
        button { background: #ecf0f1; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #2c3e50; font-size: 1rem; transition: 0.2s; }
        button:hover:not(:disabled) { background: #bdc3c7; }
        button:disabled { opacity: 0.7; cursor: default; }
        #feedback { margin-top: 15px; height: 24px; font-weight: bold; font-size: 1.1rem; }
        .hidden { display: none; }
        .restart-btn { background: #27ae60; color: white; margin-top: 15px; width: 100%; }
    
.high-score-label {
    font-size: 0.7rem;
    color: #f1c40f; /* Gold color */
    margin-top: 4px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

</style>
</head>
<body>

<div id="game-card">
    <!-- 1. MAIN MENU -->
    <div id="menu-area">
        <h2 style="color: #f1c40f;">Kennzeichen App</h2>
        <button class="restart-btn" onclick="startQuiz()">Spiel Starten</button>
        <button class="restart-btn" style="background: #3498db;" onclick="openSearch()">Kennzeichen Suchen</button>
        <div id="high-score-display" class="high-score-label" style="margin-top:20px;">Best: 0%</div>
    </div>

    <!-- 2. SEARCH AREA -->
    <div id="search-area" class="hidden">
        <h3>Suche</h3>
        <input type="text" id="search-input" placeholder="Code eingeben (z.B. AA)..." 
               oninput="handleSearch()" 
               style="width: 80%; padding: 10px; border-radius: 5px; border: none; font-size: 1.2rem; text-transform: uppercase;">
        <div id="search-result" style="margin-top: 20px; font-size: 1.5rem; min-height: 50px; font-weight: bold;"></div>
        <button class="restart-btn" style="background: #7f8c8d;" onclick="showMenu()">Zurück zum Menü</button>
    </div>

    <!-- 3. QUIZ AREA (Same as before) -->
    <div id="quiz-area" class="hidden">
    <!-- Add this Exit button at the top -->
    <div style="text-align: right; margin-bottom: 10px;">
        <button onclick="showMenu()" style="background: transparent; color: #e74c3c; padding: 5px 10px; font-size: 0.8rem; border: 1px solid #e74c3c;">✕ Abbrechen</button>
    </div>

    <div class="score-row">
        <span>Frage <span id="q-num">1</span>/20</span>
        <div style="text-align: right;">Score: <span id="percent">0</span>%</div>
    </div>

</div>

    document.getElementById('feedback').innerText = "";
    
    // 1. Pick the correct plate
    currentPlate = plates[Math.floor(Math.random() * plates.length)];
    pDisplay.innerText = currentPlate.code;

    // 2. FIND "LETTER MATCH" DISTRACTORS
    // We get the first letter of the current code (e.g., "B" from "BAD")
    const firstLetter = currentPlate.code.charAt(0);

    // Filter the whole list for other cities whose code starts with the same letter
    let similarPlates = plates.filter(p => 
        p.code.startsWith(firstLetter) && p.city !== currentPlate.city
    );

    let choices = [currentPlate.city];

    // 3. Fill choices with these similar-letter cities first
    while (choices.length < 4 && similarPlates.length > 0) {
        let randomIndex = Math.floor(Math.random() * similarPlates.length);
        // Remove from list so we don't pick the same distractor twice
        let randomCity = similarPlates.splice(randomIndex, 1)[0].city;
        if (!choices.includes(randomCity)) {
            choices.push(randomCity);
        }
    }

    // 4. Emergency Backup: If there aren't enough "B" cities, fill with random ones
    while (choices.length < 4) {
        let randomCity = plates[Math.floor(Math.random() * plates.length)].city;
        if (!choices.includes(randomCity)) {
            choices.push(randomCity);
        }
    }

    // 5. Shuffle and Render
    choices.sort(() => Math.random() - 0.5);

    const container = document.getElementById('options-container');
    container.innerHTML = '';
    choices.forEach(c => {
        const b = document.createElement('button');
        b.innerText = c;
        b.onclick = () => checkAnswer(c);
        container.appendChild(b);
    });
    
    updateUI();
}

    function checkAnswer(selected) {
        const btns = document.querySelectorAll('#options-container button');
        btns.forEach(b => b.disabled = true);
        const pDisplay = document.getElementById('plate-display');
        total++;
        
        if (selected === currentPlate.city) {
            correct++;
            playSuccessSound();            
            document.getElementById('feedback').innerText = "Richtig! ✔";
            document.getElementById('feedback').style.color = "#2ecc71";
            pDisplay.classList.add('animate-glow');
        } else {
            playErrorSound();
            document.getElementById('feedback').innerText = "Falsch! " + currentPlate.city;
            document.getElementById('feedback').style.color = "#e74c3c";
            pDisplay.classList.add('animate-shake');
        }
        setTimeout(showNext, 1200);
    }

    function updateUI() {
        document.getElementById('q-num').innerText = Math.min(total + 1, GAME_LIMIT);
        let pct = total === 0 ? 0 : Math.round((correct / total) * 100);
        document.getElementById('percent').innerText = pct;
        document.getElementById('progress-bar').style.width = (total / GAME_LIMIT) * 100 + "%";
    }

    function showEndScreen() {
        checkHighScore();
        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('results-area').classList.remove('hidden');
        document.getElementById('final-correct').innerText = correct;
    }

    window.onload = init;

// Function to play a Louder, Sharper "Ping" (Correct)
function playSuccessSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    // Using 'triangle' for a punchier start than 'sine'
    osc.type = 'triangle'; 
    osc.frequency.setValueAtTime(880, ctx.currentTime); // High A5
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1); // Slide up to E6
    
    // Increase volume to 0.3 (was 0.1)
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
}

// Function to play a Harsher "Buzzer" (Incorrect)
function playErrorSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    // 'square' is the harshest, most "retro-game" buzzer sound
    osc.type = 'square'; 
    osc.frequency.setValueAtTime(110, ctx.currentTime); // Low A2
    
    // Rapidly drop frequency for a "thud" effect
    osc.frequency.linearRampToValueAtTime(55, ctx.currentTime + 0.2); 
    
    // Increase volume to 0.25 (Square waves are naturally louder)
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
}

// Load the high score from the browser's memory
function updateHighScoreDisplay() {
    const savedBest = localStorage.getItem('plateQuizBest') || 0;
    document.getElementById('high-score-display').innerText = `Best: ${savedBest}%`;
}

// Call this at the end of showEndScreen()
function checkHighScore() {
    const currentPct = Math.round((correct / total) * 100);
    const savedBest = localStorage.getItem('plateQuizBest') || 0;

    if (currentPct > savedBest) {
        localStorage.setItem('plateQuizBest', currentPct);
        // Add a little extra feedback
        document.getElementById('feedback').innerText = "NEW PERSONAL BEST! 🏆";
        document.getElementById('feedback').style.color = "#f1c40f";
    }
    updateHighScoreDisplay();
}

// --- NAVIGATION LOGIC ---
function showMenu() {
    hideAll();
    document.getElementById('menu-area').classList.remove('hidden');
    updateHighScoreDisplay();
}

function startQuiz() {
    hideAll();
    document.getElementById('quiz-area').classList.remove('hidden');
    resetGame();
}

function openSearch() {
    hideAll();
    document.getElementById('search-area').classList.remove('hidden');
    document.getElementById('search-input').value = ""; // Clear old search
    document.getElementById('search-result').innerText = "Tippe einen Code...";
    document.getElementById('search-input').focus();
}

function hideAll() {
    document.getElementById('menu-area').classList.add('hidden');
    document.getElementById('quiz-area').classList.add('hidden');
    document.getElementById('search-area').classList.add('hidden');
    document.getElementById('results-area').classList.add('hidden');
}

// --- SEARCH ENGINE ---
function handleSearch() {
    const input = document.getElementById('search-input').value.toUpperCase().trim();
    const resultDiv = document.getElementById('search-result');
    
    if (input === "") {
        resultDiv.innerText = "Tippe einen Code...";
        return;
    }

    // Find the plate that matches the code exactly
    const found = plates.find(p => p.code.toUpperCase() === input);

    if (found) {
        resultDiv.innerHTML = `<span style="color: #2ecc71;">${found.city}</span><br><small style="font-size: 0.8rem; color: #bdc3c7;">(${found.state})</small>`;
    } else {
        resultDiv.innerText = "Nicht gefunden";
    }
}

</script>
